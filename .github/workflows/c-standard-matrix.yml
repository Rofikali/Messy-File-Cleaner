name: C standard compatibility and tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        c-standard: ["11", "17", "23"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure C${{ matrix.c-standard }}
        run: cmake -S . -B "build-c${{ matrix.c-standard }}" -DCMAKE_BUILD_TYPE=Debug -DFC_C_STANDARD=${{ matrix.c-standard }}
      - name: Build
        run: cmake --build "build-c${{ matrix.c-standard }}" --parallel 2
      - name: Run unit tests
        run: ctest --test-dir "build-c${{ matrix.c-standard }}" --output-on-failure
