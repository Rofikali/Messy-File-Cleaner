name: Ubuntu 24.04 LTS validation

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "Dockerfile"
      - "CMakeLists.txt"
      - "AGENTS.md"
      - "src/**"
      - "include/**"
      - "configs/**"
      - "tests/**"
      - ".github/workflows/ubuntu-24.04-validation.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-24.04-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-build-and-test:
    name: C${{ matrix.c-standard }} build and tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        c-standard: ["11", "17", "23"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Hosted Ubuntu 24.04: use its signed distro source configuration only.
          # Do not refresh unrelated third-party repositories or weaken signature checks.
          source_file=/etc/apt/sources.list.d/ubuntu.sources
          test -s "$source_file"
          apt_options=(-o "Dir::Etc::sourcelist=$source_file" -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends cmake ninja-build build-essential python3
          gcc --version
          cmake --version
          ninja --version
          python3 --version

      - name: Configure
        run: >-
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DFC_C_STANDARD=${{ matrix.c-standard }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Record environment and capability evidence
        run: ctest --test-dir build -R '^upstream_capability_correlation$' --no-tests=error --verbose

  container-build:
    name: Build Ubuntu development and production images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build development image
        run: docker build --pull -f .devcontainer/Dockerfile -t messy-file-cleaner-dev:ci .devcontainer

      - name: Verify development toolchain and user
        run: |
          docker run --rm --user vscode --entrypoint /bin/sh messy-file-cleaner-dev:ci -ec '
            test "$(id -un)" = "vscode"
            gcc --version
            clang --version
            cmake --version
            python3 --version
            git --version
            cppcheck --version
          '

      - name: Verify Clang production compatibility in development image
        timeout-minutes: 5
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user vscode --mount "type=bind,source=$PWD,target=/source,readonly" \
            --entrypoint /bin/sh messy-file-cleaner-dev:ci -ec '
              work=$(mktemp -d)
              trap "rm -rf \"$work\"" EXIT
              clang --version
              cmake --version
              uname -srm
              getconf GNU_LIBC_VERSION
              clang -std=c17 -Wall -Wextra -Wpedantic -Werror \
                /source/tests/reference/public_api_candidate.c \
                /source/tests/reference/public_api_candidate_mock_test.c \
                -o "$work/api-mock"
              for standard in 11 17 23; do
                cmake -S /source -B "$work/c$standard" -G Ninja \
                  -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release \
                  -DBUILD_TESTING=OFF -DFC_C_STANDARD="$standard"
                cmake --build "$work/c$standard" --parallel 2
                python3 /source/tests/integration/test_cli_help.py "$work/c$standard/file-cleaner"
                stage="$work/install$standard"
                cmake --install "$work/c$standard" --prefix "$stage"
                gate=/source/scripts/tests/check_public_api_isolation.sh
                sh "$gate" "$work/c$standard/file-cleaner" "$work/api-mock" "$stage"
                if sh "$gate" "$work/api-mock" "$work/api-mock" "$stage" > "$work/negative" 2>&1; then
                  echo "candidate symbol negative control unexpectedly passed" >&2
                  exit 1
                fi
                grep -Fx "candidate symbol leaked into production" "$work/negative"
                touch "$stage/unexpected-header.h"
                if sh "$gate" "$work/c$standard/file-cleaner" "$work/api-mock" "$stage" > "$work/negative" 2>&1; then
                  echo "install negative control unexpectedly passed" >&2
                  exit 1
                fi
                grep -Fx "unexpected staged install content" "$work/negative"
                rm "$stage/unexpected-header.h"
                printf "public_api_isolation_controls=PASS c_standard=%s\n" "$standard"
                printf "clang_production_compat=PASS c_standard=%s\n" "$standard"
              done
            '

      - name: Verify full Clang C17 Release test suite
        timeout-minutes: 8
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user vscode --mount "type=bind,source=$PWD,target=/source,readonly" \
            --entrypoint /bin/sh messy-file-cleaner-dev:ci -ec '
              work=$(mktemp -d)
              trap "rm -rf \"$work\"" EXIT
              clang --version
              cmake --version
              uname -srm
              getconf GNU_LIBC_VERSION
              cmake -S /source -B "$work/build" -G Ninja \
                -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=ON -DFC_C_STANDARD=17
              cmake --build "$work/build" --parallel 2
              ctest --test-dir "$work/build" --no-tests=error --output-on-failure
              printf "clang_c17_release_suite=PASS\n"
              ctest --test-dir "$work/build" -R "^upstream_capability_correlation$" --no-tests=error --verbose
              # Compare independent Release builds of the same private archive.
              cmake -S /source -B "$work/repeat" -G Ninja \
                -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=ON -DFC_C_STANDARD=17
              cmake --build "$work/repeat" --target fc_classifier_reference --parallel 2
              archive="$work/build/libfc_classifier_reference.a"
              repeat="$work/repeat/libfc_classifier_reference.a"
              ar t "$archive" > "$work/members"
              printf "%s\n" classifier.c.o hashmap.c.o > "$work/expected-members"
              cmp "$work/members" "$work/expected-members"
              cmp "$archive" "$repeat"
              sha256sum "$archive" "$repeat"
              printf "static_archive_repeatability=PASS members=2 compiler=clang standard=c17\n"
              gate=/source/scripts/tests/check_static_classifier_symbols.sh
              sh "$gate" "$archive"
              printf "int fc_unexpected_symbol(void) { return 0; }\n" > "$work/unexpected.c"
              clang -std=c17 -Wall -Wextra -Wpedantic -Werror -c "$work/unexpected.c" -o "$work/unexpected.o"
              cp "$archive" "$work/extra.a"
              ar r "$work/extra.a" "$work/unexpected.o"
              if sh "$gate" "$work/extra.a" > "$work/negative" 2>&1; then
                echo "extra symbol control unexpectedly passed" >&2
                exit 1
              fi
              grep -Fx "unexpected archive global definitions" "$work/negative"
              cp "$archive" "$work/missing.a"
              ar d "$work/missing.a" hashmap.c.o
              if sh "$gate" "$work/missing.a" > "$work/negative" 2>&1; then
                echo "missing symbol control unexpectedly passed" >&2
                exit 1
              fi
              grep -Fx "unexpected archive global definitions" "$work/negative"
              printf "static_classifier_symbol_controls=PASS controls=2\n"
              dep_gate=/source/scripts/tests/check_static_classifier_dependencies.sh
              sh "$dep_gate" "$archive"
              mkdir "$work/dependency-control"
              printf "extern void fc_unapproved_dependency(void); void fc_probe(void) { fc_unapproved_dependency(); }\n" > "$work/dependency-control/probe.c"
              clang -std=c17 -Wall -Wextra -Wpedantic -Werror -c "$work/dependency-control/probe.c" -o "$work/dependency-control/classifier.c.o"
              cp "$archive" "$work/bad-dependency.a"
              ar r "$work/bad-dependency.a" "$work/dependency-control/classifier.c.o"
              if sh "$dep_gate" "$work/bad-dependency.a" > "$work/negative" 2>&1; then
                echo "unexpected dependency control passed" >&2
                exit 1
              fi
              grep -Fx "unexpected archive dependency: classifier.c.o" "$work/negative"
              printf "extern void classify(void); void fc_probe(void) { classify(); }\n" > "$work/dependency-control/probe.c"
              clang -std=c17 -Wall -Wextra -Wpedantic -Werror -c "$work/dependency-control/probe.c" -o "$work/dependency-control/hashmap.c.o"
              cp "$archive" "$work/reverse-dependency.a"
              ar r "$work/reverse-dependency.a" "$work/dependency-control/hashmap.c.o"
              if sh "$dep_gate" "$work/reverse-dependency.a" > "$work/negative" 2>&1; then
                echo "reverse dependency control passed" >&2
                exit 1
              fi
              grep -Fx "unexpected archive dependency: hashmap.c.o" "$work/negative"
              printf "static_classifier_dependency_controls=PASS controls=2\n"
              sh /source/scripts/tests/report_platform_capabilities.sh "$work/build" container_release
            '

      - name: Verify internal header self-containment with GCC and Clang
        timeout-minutes: 5
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user vscode --mount "type=bind,source=$PWD,target=/source,readonly" \
            --entrypoint /bin/sh messy-file-cleaner-dev:ci \
            /source/scripts/tests/test_internal_headers.sh

      - name: Compile design-only public API consumer fixture
        timeout-minutes: 3
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user vscode --mount "type=bind,source=$PWD,target=/source,readonly" \
            --entrypoint /bin/sh messy-file-cleaner-dev:ci -ec '
              for compiler in gcc clang; do
                for standard in c11 c17 c2x; do
                  "$compiler" -std="$standard" -Wall -Wextra -Wpedantic -Werror \
                    -fsyntax-only /source/tests/reference/public_api_candidate.c
                  printf "public_api_candidate_syntax=PASS compiler=%s standard=%s\n" "$compiler" "$standard"
                done
              done
            '

      - name: Run isolated public API mock caller checks
        timeout-minutes: 3
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user vscode --mount "type=bind,source=$PWD,target=/source,readonly" \
            --entrypoint /bin/sh messy-file-cleaner-dev:ci -ec '
              work=$(mktemp -d)
              for compiler in gcc clang; do
                for standard in c11 c17 c2x; do
                  "$compiler" -std="$standard" -Wall -Wextra -Wpedantic -Werror \
                    /source/tests/reference/public_api_candidate.c \
                    /source/tests/reference/public_api_candidate_mock_test.c \
                    -o "$work/mock"
                  printf "mock compiler=%s standard=%s\n" "$compiler" "$standard"
                  "$work/mock"
                done
              done
            '

      - name: Verify full Clang C17 Debug suite on existing hosted runner
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          compiler=$(command -v clang-18)
          "$compiler" --version
          cmake --version
          uname -srm
          getconf GNU_LIBC_VERSION
          export ASAN_OPTIONS=halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          printf 'int main(void) { return 0; }\n' > "$work/probe.c"
          "$compiler" -std=c17 -fsanitize=address,undefined \
            -fno-sanitize-recover=all "$work/probe.c" -o "$work/probe"
          "$work/probe"
          printf 'clang_sanitizer_runtime=PASS\n'
          mkdir "$work/source"
          git archive HEAD | tar -x -C "$work/source"
          "$compiler" -std=c17 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all -g \
            "$work/source/tests/reference/public_api_candidate.c" \
            "$work/source/tests/reference/public_api_candidate_mock_test.c" \
            -o "$work/api-mock"
          ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 "$work/api-mock"
          printf 'public_api_mock_sanitizers=PASS\n'
          cmake -S "$work/source" -B "$work/build" -G Ninja \
            -DCMAKE_C_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DFC_C_STANDARD=17
          cmake --build "$work/build" --parallel 2
          ctest --test-dir "$work/build" --no-tests=error --output-on-failure
          printf 'clang_c17_debug_suite=PASS environment=hosted_runner\n'
          ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ctest --test-dir "$work/build" -R '^static_classifier_consumer$' --no-tests=error --verbose
          printf 'static_classifier_sanitizer_consumer=PASS\n'
          ctest --test-dir "$work/build" -R '^shared_classifier_(consumer|runtime)$' --no-tests=error --verbose
          ctest --test-dir "$work/build" -R '^upstream_capability_correlation$' --no-tests=error --verbose
          sh "$work/source/scripts/tests/report_platform_capabilities.sh" "$work/build" hosted_debug

      - name: Build production image
        run: docker build --pull -t messy-file-cleaner:ci .

      - name: Verify production image is non-root
        run: |
          docker run --rm --entrypoint /bin/sh messy-file-cleaner:ci -ec '
            test "$(id -u)" = "10001"
            test -x /usr/local/bin/file-cleaner
          '
