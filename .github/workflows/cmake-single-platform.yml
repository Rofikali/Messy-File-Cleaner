name: CMake build and test matrix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        c-standard: ["11", "17", "23"]
        build-type: ["Debug", "Release"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure C${{ matrix.c-standard }} (${{ matrix.build-type }})
        run: cmake -S . -B "build-c${{ matrix.c-standard }}-${{ matrix.build-type }}" -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DFC_C_STANDARD=${{ matrix.c-standard }}
      - name: Build
        run: cmake --build "build-c${{ matrix.c-standard }}-${{ matrix.build-type }}" --parallel 2
      - name: Run unit tests
        run: ctest --test-dir "build-c${{ matrix.c-standard }}-${{ matrix.build-type }}" --output-on-failure
