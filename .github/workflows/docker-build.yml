name: Docker image build and runtime smoke tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  docker-build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and load runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: messy-file-cleaner:ci

      - name: Verify safe dry-run and real move in isolated directories
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/.docker-smoke"
          mkdir -p "$ROOT/input" "$ROOT/output" "$ROOT/state"
          chmod 0777 "$ROOT/input" "$ROOT/output" "$ROOT/state"

          printf 'dry-run fixture\n' > "$ROOT/input/dry-run.jpg"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --mount "type=bind,src=$ROOT/input,dst=/input,readonly" \
            --mount "type=bind,src=$ROOT/output,dst=/output" \
            --mount "type=bind,src=$ROOT/state,dst=/output/journal" \
            --workdir /output \
            messy-file-cleaner:ci \
            /input --config /app/configs/default.conf --dry-run --once

          test -f "$ROOT/input/dry-run.jpg"
          test ! -e "$ROOT/output/Jpeg/dry-run.jpg"

          printf 'move fixture\n' > "$ROOT/input/execute.png"
          # FS-01B-GUARD: a real mover must not retire entries from an
          # other-writable source. The standalone CTest covers refusal;
          # this positive Docker smoke now uses private, runner-owned dirs.
          chmod 0700 "$ROOT/input" "$ROOT/output" "$ROOT/state"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --mount "type=bind,src=$ROOT/input,dst=/input" \
            --mount "type=bind,src=$ROOT/output,dst=/output" \
            --mount "type=bind,src=$ROOT/state,dst=/output/journal" \
            --workdir /output \
            messy-file-cleaner:ci \
            /input --config /app/configs/default.conf --once

          test ! -e "$ROOT/input/execute.png"
          test -f "$ROOT/output/Png/execute.png"
          test -s "$ROOT/state/move.log"

      - name: Verify Compose default and explicit execution modes with disposable files
        shell: bash
        run: |
          set -euo pipefail

          # CI starts from a fresh checkout. Never touch any pre-existing path.
          test ! -e input
          test ! -e output
          test ! -e state
          mkdir input output state
          # Ephemeral GitHub runner disposes these CI-created fixtures. A
          # non-root container owns subdirectories; never recursively delete
          # them as the runner user or widen runtime permissions for cleanup.
          chmod 0777 input output state

          # The default path is dry-run AND read-only at the container mount layer.
          docker compose -f compose.yaml config --format json | python3 -c '
          import json, sys
          service = json.load(sys.stdin)["services"]["cleaner"]
          mounts = [m for m in service["volumes"] if m["target"] == "/input"]
          assert len(mounts) == 1, "expected exactly one input mount"
          assert mounts[0].get("read_only") is True, "default input must be readonly"
          assert "--dry-run" in service["command"], "default command must be dry-run"
          '

          # The deliberately named overlay is the ONLY Compose mode that
          # supplies a writable source and removes the dry-run argument.
          docker compose -f compose.yaml -f compose.execute.yaml config --format json | python3 -c '
          import json, sys
          service = json.load(sys.stdin)["services"]["cleaner"]
          mounts = [m for m in service["volumes"] if m["target"] == "/input"]
          assert len(mounts) == 1, "expected exactly one input mount"
          assert mounts[0].get("read_only", False) is False, "execute input must be writable"
          assert "--dry-run" not in service["command"], "execute cannot be dry-run"
          assert "--once" in service["command"], "execute should be bounded batch"
          '

          # Reuse the exact image already built and smoke-tested in this job.
          docker tag messy-file-cleaner:ci messy-file-cleaner:local

          printf 'compose dry-run fixture\n' > input/dry-run.jpg
          docker compose -f compose.yaml run --rm --no-deps cleaner
          test -f input/dry-run.jpg
          test ! -e output/Jpeg/dry-run.jpg

          printf 'compose explicit move fixture\n' > input/execute.png
          # Preview above intentionally exercises the default non-root UID.
          # For real moves, match the host fixture owner and restrict the
          # source, output and state to that UID; never relax the mover gate.
          chmod 0700 input output state
          PUID="$(id -u)" PGID="$(id -g)" \
            docker compose -f compose.yaml -f compose.execute.yaml run --rm --no-deps cleaner
          test ! -e input/execute.png
          test -f output/Png/execute.png
          test -s state/move.log
