name: CMake build and test matrix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  feature-budget:
    name: Five-PR feature delivery contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test feature ledger validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_feature_budget.py'
      - name: Verify budget and PR's declared feature
        run: python3 scripts/feature_budget_check.py --event "$GITHUB_EVENT_PATH"
      - name: Test upstream import lock
        run: python3 -m unittest discover -s scripts/tests -p 'test_upstream_import.py'
      - name: Enforce upstream import lock
        run: python3 scripts/upstream_import_check.py
      - name: Verify bounded APT retry behavior
        run: sh scripts/tests/test_apt_retry.sh
      - name: Test direct build-input gate
        run: sh scripts/tests/test_build_inputs.sh
      - name: Verify declared direct build inputs
        run: sh scripts/check_build_inputs.sh

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        c-standard: ["11", "17", "23"]
        build-type: ["Debug", "Release"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure C${{ matrix.c-standard }} (${{ matrix.build-type }})
        run: cmake -S . -B "build-c${{ matrix.c-standard }}-${{ matrix.build-type }}" -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DFC_C_STANDARD=${{ matrix.c-standard }}
      - name: Build
        run: cmake --build "build-c${{ matrix.c-standard }}-${{ matrix.build-type }}" --parallel 2
      - name: Run unit tests
        run: ctest --test-dir "build-c${{ matrix.c-standard }}-${{ matrix.build-type }}" --output-on-failure
      - name: Report bounded scanner reference evidence
        if: matrix.c-standard == '17' && matrix.build-type == 'Release'
        run: |
          uname -srm
          cc --version
          getconf GNU_LIBC_VERSION
          ctest --test-dir build-c17-Release -R '^scanner_reference_benchmark_smoke$' --no-tests=error --verbose --output-on-failure
          ctest --test-dir build-c17-Release -R '^linux_io_reference$' --no-tests=error --verbose --output-on-failure
          ctest --test-dir build-c17-Release -R '^linux_uring_capability$' --no-tests=error --verbose --output-on-failure
          ctest --test-dir build-c17-Release -R '^batch_io_reference$' --no-tests=error --verbose --output-on-failure
          ctest --test-dir build-c17-Release -R '^cache_layout_reference$' --no-tests=error --verbose --output-on-failure
          ctest --test-dir build-c17-Release -R '^cpu_opt_reference$' --no-tests=error --verbose --output-on-failure
          objdump -d --disassemble=scalar_count build-c17-Release/cpu-opt-reference
          ctest --test-dir build-c17-Release -R '^linux_scanner_cloexec$' --no-tests=error --verbose --output-on-failure
          ctest --test-dir build-c17-Release -R '^config_stream_fault
 --no-tests=error --verbose --output-on-failure
          ctest --test-dir build-c17-Release -R '^statx_timing_reference
 --no-tests=error --verbose --output-on-failure
